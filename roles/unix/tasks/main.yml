---
- name: Install packages
  ansible.builtin.package:
      name: "{{ item }}"
      state: present
  loop:
      - tree

- name: Delete files
  ansible.builtin.file:
      path: "{{ item }}"
      state: absent
  loop:
      - "~/.config/alacritty"

- name: Create required directories
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      mode: "0755"
  loop:
      - "~/.ssh/config.d"
      - "~/.vim/colors"
      - "~/.vim/autoload"
      - "~/.config/ghostty"
      - "~/.config/zsh"
      - "~/.config/streamlink"
      - "~/.config/zed"
      - "~/.config/cursor"
      - "~/.config/opencode"
      - "~/.claude"
      - "~/.codex"
      - "~/.codex/rules"

- name: Copy common configuration files
  ansible.builtin.copy:
      src: "{{ role_path }}/files/{{ item.src }}"
      dest: "~/{{ item.dest | default(item.src) }}"
      force: true
  loop:
      - { src: ".zshrc" }
      - { src: ".gitconfig" }
      - { src: ".gitconfig-check24" }
      - { src: ".ssh/config.d/gempir" }
      - { src: ".vimrc" }
      - { src: ".vim/colors/onedark.vim" }
      - { src: ".vim/autoload/onedark.vim" }
      - { src: ".config/ghostty/config" }
      - { src: ".tmux.conf" }
      - { src: ".config/zsh/git.sh" }
      - { src: ".config/streamlink/config" }
      - {
            src: "../../../files/zed/settings.json",
            dest: ".config/zed/settings.json",
        }

- name: Link agent configs into repo with sync-back
  ansible.builtin.include_tasks: agent_config_link.yml
  loop:
      - {
            live: ".config/cursor/cli-config.json",
            repo: ".config/cursor/cli-config.json",
            sync_back: false,
        }
      - {
            live: ".config/opencode/opencode.json",
            repo: ".config/opencode/opencode.json",
        }
      - { live: ".claude/settings.json", repo: ".claude/settings.json" }
      - {
            live: ".codex/rules/allowlist.rules",
            repo: ".codex/rules/allowlist.rules",
        }
      - { live: ".codex/config.toml", repo: ".codex/config.toml" }
  loop_control:
      loop_var: agent_config

- name: Ensure ssh_config contains include
  ansible.builtin.lineinfile:
      path: "~/.ssh/config"
      line: "Include ~/.ssh/config.d/*"
      create: yes
      state: present
      regexp: "^Include ~/.ssh/config.d/\\*"
